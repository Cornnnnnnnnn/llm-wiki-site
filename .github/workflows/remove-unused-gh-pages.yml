name: Remove unused gh-pages branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-unused-gh-pages.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  cleanup:
    if: github.repository == 'Cornnnnnnnnn/llm-wiki-site'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Actions deployment and remove only the obsolete build branch
        uses: actions/github-script@v9
        with:
          script: |
            const repo = { owner: 'Cornnnnnnnnn', repo: 'llm-wiki-site' };
            const { data: pages } = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            if (pages.build_type !== 'workflow') throw new Error('Pages must use GitHub Actions before cleanup.');
            const { data: runs } = await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              ...repo, workflow_id: 'deploy.yml', branch: 'main', status: 'success', per_page: 1
            });
            if (!runs.workflow_runs.length) throw new Error('A successful main deployment is required.');
            let branch;
            try {
              branch = (await github.rest.git.getRef({ ...repo, ref: 'heads/gh-pages' })).data;
            } catch (error) {
              if (error.status === 404) { core.info('gh-pages is already absent.'); return; }
              throw error;
            }
            if (branch.object.sha !== '40085cc886f5ff501c1cd2614f5f82d43761152f') {
              throw new Error('gh-pages has changed; refusing to delete an unexpected version.');
            }
            await github.rest.git.deleteRef({ ...repo, ref: 'heads/gh-pages' });
            core.info('Deleted only the verified obsolete gh-pages branch.');
